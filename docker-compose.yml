name: smartacus

services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  odoo:
    build:
      context: .
      secrets:
        - github_token
    env_file:
      - .env
    environment:
      - ODOO_DEV_MODE=${ODOO_DEV_MODE:-true}
      - SKIP_MODULE_SETUP=false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons/client
      # smartacus_editor's static file serving resolves from this image-baked
      # path rather than /mnt/extra-addons/client/smartacus, so mount it too
      # to avoid manually re-copying after every JS/CSS edit in local dev.
      - ./addons/smartacus:/mnt/extra-addons/smartacus
      # oca/dms isn't baked into the base image yet — mount it directly from
      # the shared ordomatics checkout so it's discoverable on addons_path
      # (the entrypoint auto-adds each subdir of /mnt/extra-addons/oca/*).
      - /home/moctardiallo/projects/ordomatics/odoo/addons/oca/dms:/mnt/extra-addons/oca/dms
      - /home/moctardiallo/projects/ordomatics/odoo/addons/billing:/mnt/extra-addons/billing
      - ./logs:/var/log/odoo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      odoo:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tunnel

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  odoo-db-data:
  odoo-web-data:
