name: smartacus

services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  odoo:
    build:
      context: .
      # Same Odoo version as CI (ci.yaml's PLATFORM_TAG): the Dockerfile's
      # default, latest, is now Odoo 19.
      args:
        PLATFORM_TAG: "18.0"
      secrets:
        - github_token
    # The single threaded dev process idles near the 2 GB default soft limit
    # (checked on VMS), so any job spawning threads triggered a reload.
    command: ["odoo", "--limit-memory-soft=4294967296", "--limit-memory-hard=5368709120"]
    env_file:
      - .env
    environment:
      - ODOO_DEV_MODE=${ODOO_DEV_MODE:-true}
      - SKIP_MODULE_SETUP=false
      # Wave signs each webhook with its own secret: this stack's is the dev one.
      - WAVE_WEBHOOK_SIGNING_SECRET=${WAVE_WEBHOOK_SIGNING_SECRET_DEV:-${WAVE_WEBHOOK_SIGNING_SECRET}}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons/client
      # smartacus_editor's static file serving resolves from this image-baked
      # path rather than /mnt/extra-addons/client/smartacus, so mount it too
      # to avoid manually re-copying after every JS/CSS edit in local dev.
      - ./addons/smartacus:/mnt/extra-addons/smartacus
      - ./logs:/var/log/odoo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      odoo:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tunnel

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  odoo-db-data:
  odoo-web-data:
